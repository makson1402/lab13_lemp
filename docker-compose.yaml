version: '3.8'

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

services:
  # 1. Serwer WWW (Nginx) - podłączony do obu sieci, wystawiony port 4001
  webserver:
    image: nginx:1.25-alpine
    container_name: lemp-nginx
    ports:
      - "4001:80"
    volumes:
      - ./html:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - frontend
      - backend
    depends_on:
      - php

  # 2. Serwer PHP-FPM - podłączony tylko do backendu
  php:
    image: php:8.2-fpm-alpine
    container_name: lemp-php
    volumes:
      - ./html:/var/www/html
    networks:
      - backend

  # 3. Baza danych MySQL - podłączona tylko do backendu
  mysql:
    image: mysql:8.0
    container_name: lemp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: test_db
      MYSQL_USER: user_lemp
      MYSQL_PASSWORD: user_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend

  # 4. Narzędzie phpMyAdmin - podłączone do backendu i frontendu (aby mieć dostęp przez przeglądarkę)
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: lemp-phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root_password
    networks:
      - frontend
      - backend
    depends_on:
      - mysql

volumes:
  db_data: